<header class="bg-white shadow border-b border-gray-200">
  <div class="mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex justify-between items-center py-4">
      <div class="flex items-center">
        <h1 class="text-2xl font-bold fb-blue">Family File Storage</h1>
      </div>
      <div class="flex items-center space-x-4">
        <span class="text-sm text-gray-700">Welcome, {{ currentUser | uppercase}}</span>
        <button
          (click)="logout.emit()"
          class="fb-button text-sm"
        >
          Logout
        </button>
      </div>
    </div>
  </div>
</header>
