<router-outlet></router-outlet>

@if(errorModalService.show()){
<app-error-modal
  [title]="errorModalService.title()"
  [message]="errorModalService.message()"
  (close)="errorModalService.close()"
></app-error-modal>
}

@if(successModalService.show()){
<app-success-modal
  [title]="successModalService.title()"
  [message]="successModalService.message()"
  (close)="successModalService.close()"
></app-success-modal>
}
