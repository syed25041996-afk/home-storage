name: Deploy
on: [push]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: 🚀 Direct SSH Deployment
      run: |
        # Execute deployment
        ssh -p ${{ secrets.NGROK_PORT }} \
          -i ~/.ssh/id_rsa \
          -o IdentitiesOnly=yes \
          -o StrictHostKeyChecking=no \
          -o ConnectTimeout=30 \
          ${{ secrets.SSH_USERNAME }}@${{ secrets.NGROK_HOST }} << 'DEPLOY_EOF'
        set -e
        echo "🚀 Deployment started"
        cd /home/home/apps/home-storage
        ./deploy.sh
        echo "✅ Deployment completed"
        DEPLOY_EOF