name: Deploy to Home Server

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOME_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 18224 0.tcp.in.ngrok.io >> ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -p 18224 \
              -o StrictHostKeyChecking=no \
              -o ConnectTimeout=10 \
              home@0.tcp.in.ngrok.io << 'EOF'
            cd /home/home/apps/home-storage
            ./deploy.sh
          EOF
