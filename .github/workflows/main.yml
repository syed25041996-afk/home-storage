name: Deploy to Server

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    # - name: Setup Node.js
    #   uses: actions/setup-node@v3
    #   with:
    #     node-version: '18'
    #     cache: 'npm'
        
    # ========== ANGULAR BUILD ==========
    - name: Install Angular dependencies
      run: |
        cd home-backup || true
        npm ci
        
    - name: Build Angular application
      run: |
        cd home-backup || true
        npm run build -- --configuration=production
      env:
        NODE_OPTIONS: '--max_old_space_size=4096'
        
    # ========== NODE.JS BACKEND BUILD ==========
    - name: Install Node.js API dependencies
      run: |
        cd home-backup-api || true
        npm ci --only=production
        
    # ========== DEPLOY TO SERVER ==========
    - name: Deploy to Server
      uses: appleboy/scp-action@v1
      with:
        host: 192.168.1.107
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        source: "home-backup/dist/,home-backup-api/"
        target: "/home/webapp/home-storage/"
        strip_components: 1
        overwrite: true
        
    - name: Setup Server Dependencies and Start
      uses: appleboy/ssh-action@v0.1.5
      with:
        host: 192.168.1.107
        username: ${{ secrets.SSH_USERNAME }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: 22
        script: |
          cd /home/webapp/home-storage/
          
          # Install API dependencies on server
          cd home-backup-api
          npm install --production
          
          # Setup PM2 for process management
          if ! command -v pm2 &> /dev/null; then
            npm install -g pm2
          fi
          
          # Start/Restart the Node.js API
          pm2 delete home-backup-api 2>/dev/null || true
          pm2 start server.js --name "home-backup-api"
          pm2 save
          pm2 startup
          
          # Configure Nginx for Angular app (if needed)
          echo "Setting up web server..."
          
          # Create or update Nginx config
          sudo bash -c 'cat > /etc/nginx/sites-available/home-storage << EOF
          server {
              listen 80;
              server_name 192.168.1.107;
              
              location /api {
                  proxy_pass http://localhost:3000;
                  proxy_http_version 1.1;
                  proxy_set_header Upgrade \$http_upgrade;
                  proxy_set_header Connection "upgrade";
                  proxy_set_header Host \$host;
                  proxy_cache_bypass \$http_upgrade;
              }
              
              location / {
                  root /var/www/home-storage/home-backup/dist/browser;
                  try_files \$uri \$uri/ /index.html;
                  index index.html index.htm;
              }
          }
          EOF'
          
          # Enable site
          sudo ln -sf /etc/nginx/sites-available/home-storage /etc/nginx/sites-enabled/
          sudo nginx -t
          sudo systemctl restart nginx