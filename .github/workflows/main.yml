name: 'Usage of scp-action GitHub Action'
on:
    push:
        branches:
            - main
jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
        - uses: actions/checkout@v4
        - name: copy file via ssh password
          uses: appleboy/scp-action@v0.1.7
          with:
            host: 192.168.1.107
            username: webapp
            password: 1234
            source: "/home/syed/Documents/test.txt"
            target: "/home/webapp/"